# 設定専用ファイル（packages: を持たないため workspace は構成しない）。
# pnpm 11 では allowBuilds 等の設定がここに集約される。
# 値 true = postinstall を実行 / false = 明示的にスキップ（未指定だと pnpm がエラーにする）。
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  # esbuild は postinstall が JS ランチャをネイティブバイナリに置換し、
  # pnpm の node ラッパシム経由の起動と衝突する。プレビルト
  # (@esbuild/<platform>) で動作するため build はスキップする。
  esbuild: false
  # @google/genai の prepare/build は patch-package・rollup・api-extractor 等の
  # dev ツールを要するが、published パッケージは dist 同梱で build 不要。スキップする。
  '@google/genai': false
  # protobufjs の postinstall はライブラリ利用には不要（require は build なしで動く）。
  protobufjs: false
  serverless: true
  unrs-resolver: true
