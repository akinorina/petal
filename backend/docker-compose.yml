services:
  postgres:
    image: postgres:16-alpine
    container_name: petal_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    container_name: petal_localstack
    environment:
      SERVICES: s3
      DEBUG: 0
      S3_BUCKET: ${S3_BUCKET}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3001}
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d
      # mkcert 証明書で HTTPS を提供する（LAN 端末からの mixed content 対策）。
      # scripts/localstack/generate-localstack-cert.sh で生成する。
      - ../certs/localstack/server.test.pem:/var/lib/localstack/cache/server.test.pem:ro
      - ../certs/localstack/server.test.pem.crt:/var/lib/localstack/cache/server.test.pem.crt:ro
      - ../certs/localstack/server.test.pem.key:/var/lib/localstack/cache/server.test.pem.key:ro
    healthcheck:
      test:
        - CMD-SHELL
        - awslocal s3api head-bucket --bucket "$$S3_BUCKET" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  localstack_data:
