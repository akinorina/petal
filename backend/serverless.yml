# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: akinorina
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: petal
service: petal-backend

provider:
  name: aws
  stage: ${env:STAGE, 'dev'}
  runtime: nodejs22.x
  region: ap-northeast-1
  memorySize: 512
  timeout: 30
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    COGNITO_REGION: ${env:COGNITO_REGION}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
    COGNITO_CLIENT_SECRET: ${env:COGNITO_CLIENT_SECRET}
    S3_BUCKET: ${env:S3_BUCKET}
    CORS_ORIGINS: ${env:CORS_ORIGINS}
    SKIP_AUTH: ${env:SKIP_AUTH, 'false'}
    SKIP_AUTH_USER_ID: ${env:SKIP_AUTH_USER_ID, ''}
    SELF_SIGNUP_ENABLED: ${env:SELF_SIGNUP_ENABLED, ''}
    LOGIN_LOCKOUT_MAX_ATTEMPTS: ${env:LOGIN_LOCKOUT_MAX_ATTEMPTS, ''}
    LOGIN_LOCKOUT_DURATION_MINUTES: ${env:LOGIN_LOCKOUT_DURATION_MINUTES, ''}
    LLM_BASE_URL: ${env:LLM_BASE_URL, ''}
    LLM_API_KEY: ${env:LLM_API_KEY, ''}
    LLM_MODEL: ${env:LLM_MODEL, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminListGroupsForUser
            - cognito-idp:InitiateAuth
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:RespondToAuthChallenge
            - cognito-idp:AdminRespondToAuthChallenge
            - cognito-idp:GlobalSignOut
            - cognito-idp:AdminUserGlobalSignOut
            - cognito-idp:GetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
            - cognito-idp:AdminDeleteUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:ListUsersInGroup
            - cognito-idp:ForgotPassword
            - cognito-idp:ConfirmForgotPassword
            - cognito-idp:AssociateSoftwareToken
            - cognito-idp:VerifySoftwareToken
            - cognito-idp:SetUserMFAPreference
          Resource:
            - arn:aws:cognito-idp:ap-northeast-1:*:userpool/${env:COGNITO_USER_POOL_ID}
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:HeadObject
          Resource: arn:aws:s3:::${env:S3_BUCKET}/*

package:
  patterns:
    - '!**'
    - 'lambda.js'

functions:
  backend:
    handler: lambda.handler
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY
