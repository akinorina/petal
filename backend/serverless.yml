# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: akinorina
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: petal
service: petal-backend

provider:
  name: aws
  stage: ${env:STAGE, 'dev'}
  runtime: nodejs22.x
  region: ap-northeast-1
  memorySize: 512
  timeout: 30
  environment:
    STAGE: ${self:provider.stage}
    # 機密値（DATABASE_URL / COGNITO_CLIENT_SECRET / 各 LLM の *_API_KEY）は
    # AWS Secrets Manager の petal-backend-secrets-<stage> から Lambda 起動時に
    # 読み込む（src/lambda.ts の loadSecrets）。LOCAL では未設定のためスキップ。
    SECRETS_MANAGER_SECRET_ID: petal-backend-secrets-${self:provider.stage}
    # --- 非機密の設定（デプロイ時に .env から注入）---
    COGNITO_REGION: ${env:COGNITO_REGION}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
    S3_BUCKET: ${env:S3_BUCKET}
    CORS_ORIGINS: ${env:CORS_ORIGINS}
    SKIP_AUTH: ${env:SKIP_AUTH, 'false'}
    SKIP_AUTH_USER_ID: ${env:SKIP_AUTH_USER_ID, ''}
    SELF_SIGNUP_ENABLED: ${env:SELF_SIGNUP_ENABLED, ''}
    LOGIN_LOCKOUT_MAX_ATTEMPTS: ${env:LOGIN_LOCKOUT_MAX_ATTEMPTS, ''}
    LOGIN_LOCKOUT_DURATION_MINUTES: ${env:LOGIN_LOCKOUT_DURATION_MINUTES, ''}
    LLM_PROVIDER: ${env:LLM_PROVIDER, 'local'}
    CLAUDE_MODEL: ${env:CLAUDE_MODEL, ''}
    GEMINI_MODEL: ${env:GEMINI_MODEL, ''}
    OPENAI_MODEL: ${env:OPENAI_MODEL, ''}
    OPENAI_BASE_URL: ${env:OPENAI_BASE_URL, ''}
    LOCALLLM_BASE_URL: ${env:LOCALLLM_BASE_URL, ''}
    LOCALLLM_MODEL: ${env:LOCALLLM_MODEL, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminListGroupsForUser
            - cognito-idp:InitiateAuth
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:RespondToAuthChallenge
            - cognito-idp:AdminRespondToAuthChallenge
            - cognito-idp:GlobalSignOut
            - cognito-idp:AdminUserGlobalSignOut
            - cognito-idp:GetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
            - cognito-idp:AdminDeleteUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:ListUsersInGroup
            - cognito-idp:ForgotPassword
            - cognito-idp:ConfirmForgotPassword
            - cognito-idp:AssociateSoftwareToken
            - cognito-idp:VerifySoftwareToken
            - cognito-idp:SetUserMFAPreference
          Resource:
            - arn:aws:cognito-idp:ap-northeast-1:*:userpool/${env:COGNITO_USER_POOL_ID}
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:HeadObject
          Resource: arn:aws:s3:::${env:S3_BUCKET}/*
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            # 末尾の -* は Secrets Manager が ARN に付与するランダム 6 文字に対応
            - arn:aws:secretsmanager:ap-northeast-1:*:secret:petal-backend-secrets-${self:provider.stage}-*

package:
  patterns:
    - '!**'
    - 'lambda.js'

functions:
  backend:
    handler: lambda.handler
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY
