version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # frontend は workspace に属さない独立 pnpm プロジェクト。
            # frontend/pnpm-lock.yaml と frontend/pnpm-workspace.yaml(allowBuilds)
            # により、symlink を跨がない素直な install が再現可能に行える。
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: frontend
